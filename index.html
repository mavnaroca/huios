<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seminário HUIOS</title>
<style>
  :root{
    --bg:#F7F6F3; --surface:#FFFFFF; --border:#E3E1DA; --text:#111111; --muted:#6B6963;
    --primary:#111111; --primary-dark:#000000; --accent:#8B6914;
    --success:#1E7B34; --success-bg:#E6F4EA;
    --danger:#B3261E; --danger-bg:#FBEAE9;
    --warning:#9C6500; --warning-bg:#FFF2CC;
    --info:#1A5FB4; --info-bg:#E8F0FE;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,h3{margin:0 0 8px;color:var(--primary-dark);}
  p{margin:0 0 10px;line-height:1.5;}
  .muted{color:var(--muted);}
  a{color:var(--accent);}
  .topbar{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:90;}
  .topbar .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .topbar .who{font-size:13px;opacity:.9;}
  .container{max-width:1000px;margin:0 auto;padding:24px 16px 96px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.danger{background:var(--danger);}
  .btn.success{background:var(--success);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted);}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;}
  .field-senha-wrap{position:relative;}
  .field-senha-wrap input{padding-right:40px;}
  .pwd-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:6px 8px;line-height:1;}
  .field textarea{min-height:80px;resize:vertical;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;}
  .badge.pendente{background:var(--warning-bg);color:var(--warning);}
  .badge.aprovado,.badge.liberado,.badge.presente,.badge.concluido{background:var(--success-bg);color:var(--success);}
  .badge.rejeitado,.badge.ausente,.badge.reprovado{background:var(--danger-bg);color:var(--danger);}
  .badge.Ativo{background:var(--success-bg);color:var(--success);}
  .badge.Inativo{background:var(--danger-bg);color:var(--danger);}
  .badge.Formado{background:#F5E9D0;color:var(--accent);}
  .badge.PendenteInscricao{background:var(--warning-bg);color:var(--warning);}
  .badge.Inscrito{background:var(--info-bg);color:var(--info);}
  .badge.Bolsista{background:#F5E9D0;color:var(--accent);}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .stat .value{font-size:24px;font-weight:700;color:var(--primary-dark);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
  .bar-row .name{width:150px;flex-shrink:0;color:var(--muted);}
  .bar-track{flex:1;background:#EDEBE5;border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
  .bar-row .val{width:90px;text-align:right;font-weight:600;}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .tab-btn{background:none;border:none;border-top:3px solid transparent;flex:1 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 6px 8px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;}
  .tab-btn .tab-icon{font-size:19px;line-height:1;}
  .tab-btn .tab-label{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab-btn.active{color:var(--primary);border-top-color:var(--accent);}
  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--primary-dark);color:#fff;padding:14px 22px;border-radius:8px;font-size:14px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:320px;text-align:center;}
  .toast.error{background:var(--danger);}
  .toast.success{background:var(--success);}
  .hero{text-align:center;padding:50px 16px;}
  .hero h1{font-size:20px;}
  .hero p{max-width:520px;margin:0 auto 22px;color:var(--muted);font-size:12px;}
  .hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:700px){.split{grid-template-columns:1fr;}}
  .link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
  .empty{color:var(--muted);font-style:italic;padding:14px 0;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
  img.preview{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--border);}

  .carteirinha-wrap{max-width:340px;margin:6px auto 16px;}
  .carteirinha-flip{position:relative;width:100%;aspect-ratio:1.586/1;perspective:1200px;}
  .carteirinha-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;transition:transform .6s cubic-bezier(.4,.2,.2,1);background:#111111;color:#fff;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;border:1px solid #2a2a2a;}
  .carteirinha-face::before{content:'';position:absolute;top:-40%;right:-30%;width:70%;height:140%;background:radial-gradient(circle,rgba(139,105,20,.25),transparent 65%);pointer-events:none;}
  .carteirinha-face.verso{transform:rotateY(180deg);}
  .carteirinha-flip.flipped .carteirinha-face{transform:rotateY(180deg);}
  .carteirinha-flip.flipped .carteirinha-face.verso{transform:rotateY(360deg);}
  .carteirinha-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .carteirinha-inst{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#EDE6D6;}
  .carteirinha-status{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;background:rgba(139,105,20,.35);color:#F5E9D0;padding:3px 9px;border-radius:999px;}
  .carteirinha-mid{display:flex;align-items:center;gap:14px;margin-top:auto;margin-bottom:auto;position:relative;z-index:1;}
  .carteirinha-foto{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid #8B6914;flex-shrink:0;background:#222;}
  .carteirinha-foto-fallback{width:76px;height:76px;border-radius:50%;border:2px solid #8B6914;flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;font-size:28px;color:#8B6914;}
  .carteirinha-nome{font-size:18px;font-weight:700;line-height:1.2;}
  .carteirinha-perfil{font-size:13px;color:#B8B2A3;text-transform:capitalize;margin-top:3px;}
  .carteirinha-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;color:#B8B2A3;position:relative;z-index:1;}
  .carteirinha-bottom strong{display:block;color:#fff;font-size:11px;}
  .carteirinha-verso-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;margin-bottom:14px;position:relative;z-index:1;}
  .carteirinha-verso-col{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0;}
  .carteirinha-verso-logo{height:32px;width:auto;flex-shrink:0;opacity:.95;}
  .carteirinha-verso-line{font-size:11.5px;color:#EDE6D6;}
  .carteirinha-verso-line span{display:block;font-size:9.5px;color:#8B8578;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;}
  .carteirinha-assinatura{margin-top:auto;border-top:1px solid #333;padding-top:8px;font-size:9px;color:#8B8578;text-align:center;position:relative;z-index:1;}
  .carteirinha-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center;}
</style>
</head>

/* ============================== API ============================== */
async function api(action, payload){
  if (CONFIG.API_URL.indexOf('COLOQUE_AQUI') !== -1){
    throw new Error('Configure a API_URL no topo do arquivo index.html (veja o README).');
  }
  payload = payload || {};
  payload.action = action;
  if (state.token) payload.token = state.token;
  let res;
  try{
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){
    throw new Error('Não foi possível conectar ao servidor. Verifique sua internet ou a URL da API.');
  }
  const texto = await res.text();
  let json;
  try{
    json = JSON.parse(texto);
  }catch(e){
    // o Google às vezes devolve uma página de erro (HTML) em vez da resposta da API —
    // costuma ser uma instabilidade passageira do lado do Google, não um erro do sistema.
    throw new Error('O servidor do Google demorou demais pra responder ou está temporariamente instável. Aguarde alguns segundos e tente de novo.');
  }
  if (!json.ok) throw new Error(json.error || 'Erro desconhecido.');
  return json.data;
}

function fileToBase64(inputEl){
  return new Promise((resolve, reject) => {
    const file = inputEl.files && inputEl.files[0];
    if (!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({ base64: reader.result, nome: file.name, mime: file.type });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// recorta a foto escolhida num círculo de verdade (cantos transparentes) antes de
// enviar, pra carteirinha mostrar uma foto genuinamente redonda (não uma aproximação
// quadrada com cantos arredondados) — o Google Slides não tem como recortar uma imagem
// em forma de círculo via script, então o recorte precisa vir pronto no arquivo.
function fileToCircularBase64(inputEl, tamanhoPx){
  tamanhoPx = tamanhoPx || 480;
  return new Promise((resolve, reject) => {
    const file = inputEl.files && inputEl.files[0];
    if (!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // 1) recorte "cover": um quadrado central da imagem original, sem distorcer
        const lado = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - lado) / 2;
        const sy = (img.naturalHeight - lado) / 2;

        // 2) desenha esse quadrado num canvas e aplica uma máscara circular (o que
        // ficar fora do círculo vira transparente, já que o canvas nasce transparente)
        const canvas = document.createElement('canvas');
        canvas.width = tamanhoPx;
        canvas.height = tamanhoPx;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.arc(tamanhoPx / 2, tamanhoPx / 2, tamanhoPx / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, sx, sy, lado, lado, 0, 0, tamanhoPx, tamanhoPx);
        ctx.restore();

        resolve({ base64: canvas.toDataURL('image/png'), nome: 'foto-circular.png', mime: 'image/png' });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// rótulo do perfil já flexionado pelo sexo (Aluno/Aluna, Professor/Professora,
// Coordenador/Coordenadora) — cai pra forma "(a)" quando o sexo não foi informado.
const ROTULOS_PERFIL_GENERO = {
  aluno: { Masculino: 'Aluno', Feminino: 'Aluna', neutro: 'Aluno(a)' },
  professor: { Masculino: 'Professor', Feminino: 'Professora', neutro: 'Professor(a)' },
  secretaria: { Masculino: 'Secretário', Feminino: 'Secretária', neutro: 'Secretaria' },
  coordenador: { Masculino: 'Coordenador', Feminino: 'Coordenadora', neutro: 'Coordenador(a)' }
};
function rotuloPerfilComGenero(perfil, sexo){
  const p = ROTULOS_PERFIL_GENERO[String(perfil||'').toLowerCase()];
  if (!p) return perfil || '';
  return p[sexo] || p.neutro;
}
// nome completo -> só o primeiro e o último nome (mesma lógica usada no PDF da
// carteirinha) — evita nome do meio ocupando espaço à toa no cartão pequeno.
function primeiroUltimoNome(nomeCompleto){
  const partes = String(nomeCompleto||'').trim().split(/\s+/).filter(Boolean);
  if (partes.length <= 1) return partes[0] || '';
  return partes[0] + ' ' + partes[partes.length-1];
}
// campo de senha com botão de "olho" — troca o type do input entre password/text
function campoSenha(labelTexto, nomeCampo, opts){
  opts = opts || {};
  return `<div class="field"><label>${escapeHtml(labelTexto)}</label>
    <div class="field-senha-wrap">
      <input required type="password" name="${nomeCampo}" ${opts.minlength ? `minlength="${opts.minlength}"` : ''} autocomplete="${opts.autocomplete || 'new-password'}">
      <button type="button" class="pwd-toggle" onclick="alternarVisibilidadeSenha(this)" aria-label="Mostrar senha" tabindex="-1">👁</button>
    </div>
  </div>`;
}
function alternarVisibilidadeSenha(btn){
  const input = btn.previousElementSibling;
  if (!input) return;
  const mostrando = input.type === 'text';
  input.type = mostrando ? 'password' : 'text';
  btn.textContent = mostrando ? '👁' : '🙈';
  btn.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
}

/* ---- assinatura por toque/mouse (canvas), usada pra rubricar o contrato de inscrição ---- */
let assinaturaCtx = null;
let assinaturaDesenhando = false;
let assinaturaTemTraco = false;

function iniciarCanvasAssinatura(){
  const canvas = document.getElementById('assinaturaCanvas');
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111111';
  assinaturaCtx = ctx;
  assinaturaTemTraco = false;

  function posicao(ev){
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.onpointerdown = (ev) => {
    assinaturaDesenhando = true;
    const p = posicao(ev);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(ev.pointerId);
  };
  canvas.onpointermove = (ev) => {
    if (!assinaturaDesenhando) return;
    const p = posicao(ev);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    assinaturaTemTraco = true;
  };
  canvas.onpointerup = () => { assinaturaDesenhando = false; };
  canvas.onpointerleave = () => { assinaturaDesenhando = false; };
}

function limparAssinatura(){
  const canvas = document.getElementById('assinaturaCanvas');
  if (!canvas || !assinaturaCtx) return;
  assinaturaCtx.clearRect(0, 0, canvas.width, canvas.height);
  assinaturaTemTraco = false;
}

function assinaturaVazia(){ return !assinaturaTemTraco; }

function obterAssinaturaBase64(){
  const canvas = document.getElementById('assinaturaCanvas');
  return canvas ? canvas.toDataURL('image/png') : '';
}
// converte um link "de visualização" do Drive (.../file/d/ID/view) num link direto de
// imagem — o link de visualização não funciona dentro de <img src>, só clicando nele.
function driveImgUrl(url){
  if (!url) return '';
  const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? ('https://lh3.googleusercontent.com/d/' + m[1]) : url;
}
function fmtDate(v){
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('pt-BR');
}
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
// MesReferencia às vezes chega como "2026-08" (o que o <input type="month"> manda) e às
// vezes como uma data completa (ex: "2026-08-01T07:00:00.000Z") — o Google Sheets
// converte sozinho qualquer texto que pareça uma data pro formato dele. Em vez de tentar
// impedir isso, a gente sempre reformata na exibição, lendo só os dígitos de ano/mês do
// começo da string (funciona nos dois casos, sem depender de fuso horário).
function fmtMesReferencia(v){
  if (!v) return '—';
  if (v === 'Inscrição') return v;
  const s = String(v);
  const m = s.match(/^(\d{4})-(\d{2})/);
  if (m){
    const mes = Number(m[2]);
    if (mes >= 1 && mes <= 12) return MESES_PT[mes-1] + '/' + m[1];
  }
  return s;
}
// aluno "cursando de verdade" pra fins de aula/nota/presença: já pagou a inscrição
// (Inscrito) ou já é Ativo (pagou pelo menos a 1ª mensalidade) — quem ainda está
// "PendenteInscricao" (aprovado mas não pagou a inscrição ainda) não entra nessas listas.
function alunoCursando(situacao){
  return situacao === 'Ativo' || situacao === 'Inscrito';

// rótulo amigável pra situação do aluno — o valor bruto (usado como classe CSS do

const SITUACAO_LABELS = { PendenteInscricao: 'Pendente inscrição', Inscrito: 'Inscrito', Ativo: 'Ativo', Formado: 'Formado', Inativo: 'Inativo' };
function situacaoLabel(s){ return SITUACAO_LABELS[s] || s || '—'; }
let toastTimer = null;
function toast(msg, type){
  let el = document.getElementById('toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'toast';
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4200);
}
function go(route, tab){

}

async function withLoading(btn, fn){

}

/* ============================== ROTAS ============================== */
function render(){
  const app = document.getElementById('app');
  // a barra de abas de baixo (.tabs) é recriada do zero a cada render() — sem isso, ela
  // "esquece" até onde tinha rolado horizontalmente e volta pro início dos botões toda vez
  // que se clica numa aba (ou qualquer ação chama render() de novo). Guarda a posição antes
  // e restaura na barra nova depois de montar o HTML.
  const tabsAntigo = document.querySelector('.tabs');
  const tabsScrollLeft = tabsAntigo ? tabsAntigo.scrollLeft : 0;
  let html = topbar() + '<div class="container">';
  if (state.route === 'home') html += viewHome();
  else if (state.route === 'cadastroAluno') html += viewCadastro('aluno');
  else if (state.route === 'cadastroEquipe') html += viewCadastro('equipe');
  else if (state.route === 'login') html += viewLogin();
  else if (state.route === 'calendario') html += viewCalendarioPublico();
  else if (state.route === 'painel' && state.user) html += viewPainel();
  else html += viewHome();
  html += '</div>';
  app.innerHTML = html;
  if (tabsScrollLeft){
    const tabsNovo = document.querySelector('.tabs');
    if (tabsNovo) tabsNovo.scrollLeft = tabsScrollLeft;
  }
  afterRender();
}

function afterRender(){
  if (state.route === 'painel' && state.user){
    const perfil = state.user.perfil;
    const tab = state.tab || defaultTab(perfil);
    loadTabData(perfil, tab);
  } else if (state.route === 'calendario'){
    loadCalendarioPublico();
  }
}

function defaultTab(perfil){
  return {aluno:'inicio', secretaria:'financeiro', professor:'notas', coordenador:'aprovacoes'}[perfil];
}

  };

function habilitarEdicaoContrato(btn){
  if (!confirm('Esse é o contrato que os alunos leem e assinam antes de pagar a inscrição. Tem certeza que quer editar o texto?')) return;
  const form = btn.closest('form');
  const textarea = form.querySelector('textarea[name="texto"]');
  textarea.readOnly = false;
  textarea.style.background = '#fff';
  textarea.style.color = '';
  textarea.style.cursor = '';
  textarea.focus();
  const btnSalvar = form.querySelector('#btnSalvarContrato');
  if (btnSalvar) btnSalvar.style.display = '';
  btn.style.display = 'none';
}

// mini calendário do mês, com as datas que têm evento publicado marcadas — usa só os
// eventos já carregados (calendarioMiniState.eventos), sem precisar de outra chamada ao
// servidor pra trocar de mês.
const DIAS_SEMANA_ABREV = ['D','S','T','Q','Q','S','S'];

// retorna um Map de "ano-mes-dia" -> Tipo do evento (em vez de só marcar o dia), pra
// cada célula do mini calendário poder ser pintada com a cor da própria categoria.
// quando há mais de um evento no mesmo dia, o tipo mais "específico" prevalece
// (Feriado/Evento/Férias por cima de Aula Regular, que é o pano de fundo mais comum).
const PRIORIDADE_TIPO_EVENTO = { 'Aula Regular': 0, 'Férias': 1, 'Evento': 2, 'Feriado': 3 };
function diasComEventoNoMes(eventos, ano, mes){
  const map = new Map();
  const inicioMes = new Date(ano, mes, 1);
  const fimMes = new Date(ano, mes + 1, 0);
  eventos.forEach(e => {
    const ini = new Date(e.Data);
    const fim = e.DataFim ? new Date(e.DataFim) : ini;
    if (isNaN(ini) || isNaN(fim)) return;
    let cursor = ini < inicioMes ? new Date(inicioMes) : new Date(ini.getFullYear(), ini.getMonth(), ini.getDate());
    const limite = fim > fimMes ? fimMes : fim;
    while (cursor <= limite){
      const key = cursor.getFullYear() + '-' + (cursor.getMonth()+1) + '-' + cursor.getDate();
      const atual = map.get(key);
      if (!atual || (PRIORIDADE_TIPO_EVENTO[e.Tipo]||0) >= (PRIORIDADE_TIPO_EVENTO[atual]||0)) {
        map.set(key, e.Tipo);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
  });
  return map;
}

function renderMiniCalendarioHtml(){
  const { ano, mes, eventos } = calendarioMiniState;
  const marcados = diasComEventoNoMes(eventos, ano, mes);
  const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes + 1, 0).getDate();
  const hoje = new Date();
  const ehMesAtual = hoje.getFullYear() === ano && hoje.getMonth() === mes;
  let celulas = '';
  for (let i = 0; i < primeiroDiaSemana; i++) celulas += `<div></div>`;
  for (let dia = 1; dia <= totalDias; dia++){
    const tipo = marcados.get(ano + '-' + (mes+1) + '-' + dia);
    const marcado = !!tipo;
    const c = marcado ? corEvento(tipo) : null;
    const ehHoje = ehMesAtual && hoje.getDate() === dia;
    const estiloMarcado = marcado
      ? `background:${c.forte};color:#fff;font-weight:700;box-shadow:0 0 0 2px ${c.forte} inset;`
      : '';
    celulas += `<div title="${marcado ? escapeHtml(tipo) : ''}" style="text-align:center;padding:7px 2px;border-radius:8px;font-size:13px;${estiloMarcado}${ehHoje && !marcado ? 'border:2px solid var(--primary);' : ''}${ehHoje && marcado ? 'outline:2px solid var(--primary);outline-offset:1px;' : ''}">
      ${dia}
    </div>`;
  }
  const legenda = Object.keys(CORES_EVENTO).map(tipo => {
    const c = CORES_EVENTO[tipo];
    return `<span style="display:inline-flex;align-items:center;margin-right:12px;">
      <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c.forte};margin-right:4px;"></span>${escapeHtml(tipo)}
    </span>`;
  }).join('');
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <button type="button" class="btn small secondary" onclick="mudarMesMiniCalendario(-1)">‹</button>
    <strong>${MESES_PT[mes]} de ${ano}</strong>
    <button type="button" class="btn small secondary" onclick="mudarMesMiniCalendario(1)">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:12px;">
    ${DIAS_SEMANA_ABREV.map(d => `<div style="text-align:center;font-weight:600;color:var(--muted);">${d}</div>`).join('')}
    ${celulas}
  </div>
  <p class="muted" style="margin-top:10px;font-size:12px;display:flex;flex-wrap:wrap;">${legenda}</p>`;
}

function mudarMesMiniCalendario(delta){
  calendarioMiniState.mes += delta;
  if (calendarioMiniState.mes < 0){ calendarioMiniState.mes = 11; calendarioMiniState.ano--; }
  if (calendarioMiniState.mes > 11){ calendarioMiniState.mes = 0; calendarioMiniState.ano++; }
  const container = document.getElementById('miniCalendarioContainer');
  if (container) container.innerHTML = renderMiniCalendarioHtml();
}

function renderListaCalendarioAdmin(eventos, podeEditar){
  if (!eventos.length) return `<p class="empty">Nenhum evento cadastrado ainda.</p>`;
  return `<div style="overflow-x:auto;"><table><thead><tr><th>Data</th><th>Até</th><th>Tipo</th><th>Título</th><th>Descrição</th>${podeEditar?'<th></th>':''}</tr></thead><tbody>

async function handleCriarEvento(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('criarEventoCalendario', {
        data: f.data.value, dataFim: f.dataFim.value, tipo: f.tipo.value,
        titulo: f.titulo.value, descricao: f.descricao.value,
        professorId: f.professorId ? f.professorId.value : ''
      });
      toast(data.mensagem, 'success');
      render();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function handleAtualizarImagemCalendario(ev){
  ev.preventDefault();
  const f = ev.target;
  const file = await fileToBase64(f.imagem);
  if (!file){ toast('Selecione uma imagem.', 'error'); return; }
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('atualizarImagemCalendario', { imagemBase64: file.base64, imagemNome: file.nome, imagemMime: file.mime });
      toast(data.mensagem, 'success');
      render();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function excluirEvento(id){
  if (!confirm('Excluir este evento do calendário?')) return;
  await runAction('excluirEventoCalendario', { eventoId: id });
}

/* ============================== PAINEL DE ALUNOS (estatísticas + lista + busca) ============================== */
let alunosCache = [];

let materiasEntradaCache = [];

async function renderPainelAlunosTab(podeEditar){
  const [lista, materias] = await Promise.all([
    api('listarAlunosDetalhado', {}),
    podeEditar ? api('listarMaterias', {}) : Promise.resolve([])
  ]);
  alunosCache = lista;
  materiasEntradaCache = materias;
  return `
  <div class="card">${statsAlunosHtml(lista)}</div>
  <div class="card">
    <div class="field"><label>Buscar aluno</label><input id="buscaAluno" oninput="filtrarAlunos()" placeholder="Digite o nome..."></div>
    <div id="tabelaAlunosContainer">${tabelaAlunosHtml(lista, podeEditar)}</div>
  </div>`;
}

function statsAlunosHtml(lista){
  const total = lista.length;
  // as 5 situações possíveis, na mesma ordem em que o aluno normalmente passa por elas —
  // antes só "Ativo" e "Inativo" apareciam aqui, então quem estava "Inscrito" ou "Pendente
  // inscrição" (ou já "Formado") não entrava na conta, e o total dos cards não batia com
  // o total de alunos nem com a coluna Situação da listagem abaixo.
  const pendentesInscricao = lista.filter(a => a.situacao === 'PendenteInscricao').length;
  const inscritos = lista.filter(a => a.situacao === 'Inscrito').length;
  const ativos = lista.filter(a => a.situacao === 'Ativo').length;
  const formados = lista.filter(a => a.situacao === 'Formado').length;
  const inativos = lista.filter(a => a.situacao === 'Inativo').length;
  const homens = lista.filter(a => a.sexo === 'Masculino').length;
  const mulheres = lista.filter(a => a.sexo === 'Feminino').length;
  const batizados = lista.filter(a => a.batizado === 'Sim').length;
  const naoBatizados = lista.filter(a => a.batizado === 'Não').length;
  const mesAtual = new Date().getMonth();
  const aniversariantes = lista.filter(a => {
    if (!a.dataNascimento) return false;
    const d = new Date(a.dataNascimento);
    return !isNaN(d) && d.getMonth() === mesAtual;
  });
  return `
  <h3>Painel de alunos</h3>
  <div class="grid grid-3">
    <div class="stat"><div class="label">Total de alunos</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">Pendente inscrição</div><div class="value">${pendentesInscricao}</div></div>
    <div class="stat"><div class="label">Inscritos</div><div class="value">${inscritos}</div></div>
    <div class="stat"><div class="label">Ativos</div><div class="value" style="color:var(--success);">${ativos}</div></div>
    <div class="stat"><div class="label">Formados</div><div class="value">${formados}</div></div>
    <div class="stat"><div class="label">Inativos</div><div class="value" style="color:var(--danger);">${inativos}</div></div>
    <div class="stat"><div class="label">Homens</div><div class="value">${homens}</div></div>
    <div class="stat"><div class="label">Mulheres</div><div class="value">${mulheres}</div></div>
    <div class="stat"><div class="label">Batizados</div><div class="value">${batizados}</div></div>
    <div class="stat"><div class="label">Não batizados</div><div class="value">${naoBatizados}</div></div>
    <div class="stat"><div class="label">Aniversariantes do mês</div><div class="value">${aniversariantes.length}</div></div>
  </div>
  ${aniversariantes.length ? `<div style="margin-top:14px;"><strong>Aniversariantes do mês:</strong>
    <ul>${aniversariantes.map(a => `<li>${escapeHtml(a.nome)} — ${fmtDate(a.dataNascimento)}</li>`).join('')}</ul></div>` : ''}`;
}

function tabelaAlunosHtml(lista, podeEditar){
  if (!lista.length) return `<p class="empty">Nenhum aluno encontrado.</p>`;
  const head = `<tr><th>Nome</th><th>Turma</th><th>Situação</th><th>Matéria de entrada</th><th>Sexo</th><th>Batizado</th><th title="% de presença no ano — só referência">Frequência</th><th title="Calculado automaticamente: matérias aprovadas ÷ total de matérias cadastradas">% Curso</th><th>Certificado</th><th>Área de Estágio</th>${podeEditar?'<th></th>':''}</tr>`;
  const rows = lista.map(a => {
    if (!podeEditar){
      return `<tr>
        <td>${escapeHtml(a.nome)}</td><td>${escapeHtml(a.turma)}</td>
        <td>${badge(a.situacao, situacaoLabel(a.situacao))}</td><td>${a.materiaEntrada ? escapeHtml(a.materiaEntrada) : '—'}</td>
        <td>${escapeHtml(a.sexo)||'—'}</td><td>${escapeHtml(a.batizado)||'—'}</td>
        <td class="muted">${a.percentualSugerido}%</td>
        <td><strong>${a.percentualTrilha}%</strong></td><td>${badge(a.certificadoStatus)}</td>
        <td>${a.areaEstagio ? escapeHtml(a.areaEstagio) : '<em>Não definido</em>'}</td>
      </tr>`;
    }
    return `<tr id="row-aluno-${a.id}">
      <td>${escapeHtml(a.nome)}</td>
      <td><input class="f-turma" value="${escapeHtml(a.turma)}" style="width:110px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
      <td><select class="f-situacao">
        <option value="PendenteInscricao" ${a.situacao==='PendenteInscricao'?'selected':''}>Pendente inscrição</option>
        <option value="Inscrito" ${a.situacao==='Inscrito'?'selected':''}>Inscrito</option>
        <option value="Ativo" ${a.situacao==='Ativo'?'selected':''}>Ativo</option>
        <option value="Inativo" ${a.situacao==='Inativo'?'selected':''}>Inativo</option>
        <option value="Formado" ${a.situacao==='Formado'?'selected':''}>Formado</option>
      </select></td>
      <td><select class="f-materiaEntrada" style="padding:5px;border:1px solid var(--border);border-radius:6px;">
        <option value="">—</option>
        ${materiasEntradaCache.map(m => `<option value="${escapeHtml(m.nome)}" ${a.materiaEntrada===m.nome?'selected':''}>${escapeHtml(m.nome)}</option>`).join('')}
      </select></td>
      <td><select class="f-sexo">
        <option value="">—</option>
        <option value="Masculino" ${a.sexo==='Masculino'?'selected':''}>Masculino</option>
        <option value="Feminino" ${a.sexo==='Feminino'?'selected':''}>Feminino</option>
      </select></td>
      <td><select class="f-batizado">
        <option value="">—</option>
        <option value="Sim" ${a.batizado==='Sim'?'selected':''}>Sim</option>
        <option value="Não" ${a.batizado==='Não'?'selected':''}>Não</option>
      </select></td>
      <td><span class="muted" title="% de presença no ano — só referência, não editável">${a.percentualSugerido}%</span></td>
      <td><strong title="Calculado automaticamente: matérias aprovadas ÷ total de matérias cadastradas pelo coordenador">${a.percentualTrilha}%</strong></td>
      <td>${badge(a.certificadoStatus)}</td>
      <td><input class="f-areaEstagio" value="${escapeHtml(a.areaEstagio)}" placeholder="Não definido" style="width:140px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
      <td><button class="btn small" onclick="salvarAluno('${a.id}')">Salvar</button>
      <button class="btn small secondary" onclick="verFichaAluno('${a.id}')">Ver ficha</button></td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto;"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function filtrarAlunos(){
  const termo = document.getElementById('buscaAluno').value.toLowerCase();
  const filtrado = alunosCache.filter(a => a.nome.toLowerCase().includes(termo));
  document.getElementById('tabelaAlunosContainer').innerHTML = tabelaAlunosHtml(filtrado, state.user.perfil === 'secretaria' || state.user.perfil === 'coordenador');
}

async function salvarAluno(id){
  const row = document.getElementById('row-aluno-' + id);
  const payload = {
    alunoId: id,
    turma: row.querySelector('.f-turma').value,
    situacao: row.querySelector('.f-situacao').value,
    sexo: row.querySelector('.f-sexo').value,
    batizado: row.querySelector('.f-batizado').value,
    materiaEntrada: row.querySelector('.f-materiaEntrada').value
  };
  const areaEstagio = row.querySelector('.f-areaEstagio').value;
  try{
    await api('atualizarAluno', payload);
    await api('definirAreaEstagio', { alunoId: id, areaEstagio: areaEstagio });
    toast('Dados do aluno atualizados. (O % do curso agora é automático — atualiza sozinho conforme os professores confirmam resultados.)', 'success');

}

function renderFichaPresencasTable(lista){

async function renderSecretariaTab(tab){
  if (tab === 'financeiro') return renderFinanceiroTab();
  if (tab === 'pagamentosPendentes'){
    const [pagamentos, info, painel] = await Promise.all([
      api('listarTodosPagamentos', {}),
      api('getInscricaoInfo', {}),
      api('listarPainelPagamentos', { ano: painelPagamentosAno })
    ]);
    pagamentosCache = pagamentos;
    return `<div class="card">
      <h3>Painel de pagamentos por aluno ativo — ${painel.ano}</h3>
      <div class="row" style="align-items:center;">
        <button class="btn secondary small" onclick="mudarAnoPainelPagamentos(-1)">← ${painel.ano - 1}</button>
        <button class="btn secondary small" onclick="mudarAnoPainelPagamentos(1)">${painel.ano + 1} →</button>
      </div>
      <p class="muted">Mostra só os alunos com situação "Ativo". ✔ pago/aprovado · ⏳ aguardando aprovação · ✖ rejeitado · — sem envio. Use o seletor "Tipo" pra marcar quem é bolsista — bolsista fica isento e sempre aparece marcado, sem cobrança mês a mês.</p>
      <div id="painelPagamentosContainer">${renderPainelPagamentosAlunos(painel)}</div>
    </div>
    <div class="card">

        <div class="field"><label>Status</label>
          <select id="statusPagamento" onchange="filtrarPagamentos()">
            <option value="pendente">Pendentes de aprovação</option>
            <option value="aprovado">Aprovados (realizados)</option>
            <option value="rejeitado">Rejeitados</option>
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div id="tabelaPagamentosContainer">${tabelaPagamentosHtml(pagamentos.filter(p => p.Status === 'pendente'))}</div>

  }
  if (tab === 'aprovacoesAlunos'){

function renderBars(cats, max){
  if (!cats.length) return `<p class="empty">Sem lançamentos ainda.</p>`;
  return cats.map(c => `
    <div class="bar-row">
      <div class="name">${escapeHtml(c.categoria)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c.valor/max*100)}%;"></div></div>
      <div class="val">${fmtMoney(c.valor)}</div>
    </div>`).join('');
}

function renderLancamentosTable(entradas, saidas){
  const todos = [
    ...entradas.map(e => Object.assign({}, e, { tipo: 'entrada' })),
    ...saidas.map(s => Object.assign({}, s, { tipo: 'saida' }))
  ].sort((a, c) => new Date(c.Data) - new Date(a.Data));
  if (!todos.length) return `<p class="empty">Nenhum lançamento ainda.</p>`;
  return `<div style="overflow-x:auto;"><table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr></thead><tbody>
    ${todos.map(l => `<tr>
      <td>${fmtDate(l.Data)}</td>
      <td><span class="badge ${l.tipo==='entrada'?'aprovado':'rejeitado'}">${l.tipo==='entrada'?'Entrada':'Saída'}</span></td>
      <td>${escapeHtml(l.Categoria)}</td><td>${escapeHtml(l.Descricao)||'—'}</td>
      <td style="color:${l.tipo==='entrada'?'var(--success)':'var(--danger)'};">${fmtMoney(l.Valor)}</td>
      <td><button class="btn small danger" onclick="excluirLancamento('${l.tipo}','${l.ID}')">Excluir</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

function filtrarLancamentos(){
  const termo = (document.getElementById('buscaLancamento').value || '').trim().toLowerCase();
  const filtra = arr => !termo ? arr : arr.filter(l =>
    String(l.Categoria||'').toLowerCase().includes(termo) || String(l.Descricao||'').toLowerCase().includes(termo));
  document.getElementById('lancamentosContainer').innerHTML =
    renderLancamentosTable(filtra(lancamentosCache.entradas), filtra(lancamentosCache.saidas));
}

async function excluirLancamento(tipo, id){
  if (!confirm('Excluir esse lançamento? Essa ação não pode ser desfeita.')) return;
  const action = tipo === 'entrada' ? 'excluirEntrada' : 'excluirSaida';
  const payload = tipo === 'entrada' ? { entradaId: id } : { saidaId: id };
  await runAction(action, payload);
}

// alterna os campos do formulário de aviso conforme o tipo escolhido pelo professor —
// "Proposta de Prova" não pede título/categoria, só a matéria vinculada a ele + a mensagem.
function atualizarCamposAviso(tipo){
  const ehProva = tipo === 'Proposta de Prova';
  const camposTitulo = document.getElementById('avisoCamposTitulo');
  const campoMateria = document.getElementById('avisoCampoMateria');
  const tituloInput = document.getElementById('avisoTitulo');
  if (camposTitulo) camposTitulo.style.display = ehProva ? 'none' : '';
  if (campoMateria) campoMateria.style.display = ehProva ? '' : 'none';
  if (tituloInput) tituloInput.required = !ehProva;
  const materiaSelect = campoMateria ? campoMateria.querySelector('select') : null;
  if (materiaSelect) materiaSelect.required = ehProva;
}

function renderMeusAvisosCard(lista){

    <h3>Meus avisos (status de aprovação)</h3>

        <td>${escapeHtml(a.Titulo)}</td><td>${escapeHtml(a.Categoria)}</td>
        <td>${badge(a.Status || 'aprovado')}</td><td>${fmtDate(a.DataPublicacao)}</td>
      </tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

// pendências do coordenador organizadas em dois blocos — PROVAS (propostas de prova) e
// MATERIAL DE AULAS — em vez de uma lista única misturada de professores.
function renderAvisosPendentesCard(pendentes){
  const provas = (pendentes && pendentes.provas) || [];
  const materiais = (pendentes && pendentes.materiais) || [];
  const total = provas.length + materiais.length;
  if (!total) return `<div class="card"><h3>Pendências dos professores</h3><p class="empty">Nenhum aviso pendente no momento.</p></div>`;
  return `<div class="card">
    <h3>Pendências dos professores</h3>
    <p class="muted">Organizado em blocos: propostas de prova primeiro, material de aula depois.</p>

function renderTabelaAvisosPendentes(lista){

      <td style="white-space:nowrap;"><button class="btn small success" onclick="aprovarAvisoUI('${a.ID}')">Aprovar</button>

async function aprovarAvisoUI(id){ await runAction('aprovarAviso', {avisoId:id}); }
async function rejeitarAvisoUI(id){ await runAction('rejeitarAviso', {avisoId:id}); }

async function handleCriarAviso(ev){
  ev.preventDefault();
  const f = ev.target;
  const file = await fileToBase64(f.apostila);
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('criarAviso', {
        titulo: f.titulo.value, mensagem: f.mensagem.value, categoria: f.categoria.value || 'Geral',
        tipo: f.tipo ? f.tipo.value : '', materia: f.materia ? f.materia.value : '',
        apostilaBase64: file ? file.base64 : '', apostilaNome: file ? file.nome : '', apostilaMime: file ? file.mime : ''
      });
      toast(data.mensagem, 'success');
      render();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function handleLancarMovimentacao(ev){
  ev.preventDefault();
  const f = ev.target;
  const action = f.tipo.value === 'entrada' ? 'lancarEntrada' : 'lancarSaida';
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api(action, { data: f.data.value, categoria: f.categoria.value, valor: f.valor.value, descricao: f.descricao.value, fundo: f.fundo.value });
      toast(data.mensagem, 'success');
      financeiroFundoAtual = f.fundo.value;
      loadTabData(state.user.perfil, 'financeiro');
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function rejeitarPagamento(id){ await runAction('rejeitarPagamento', {pagamentoId:id}); }

function tabelaPagamentosHtml(lista){

      <td>${fmtDate(p.DataEnvio)}</td><td>${badge(p.Status)}</td>

/* ---- Painel de pagamentos por aluno: um aluno por linha, um mês por coluna, e um
   seletor de Tipo (Pagante/Bolsista) — bolsista fica isento e sempre marcado, sem
   grade de meses (não há cobrança pra cobrar). ---- */
const MESES_PT_ABREV = MESES_PT.map(m => m.slice(0,3));
function renderPainelPagamentosAlunos(painel){
  if (!painel.lista.length) return `<p class="empty">Nenhum aluno cadastrado ainda.</p>`;
  return `<div style="overflow-x:auto;"><table><thead><tr>
    <th>Aluno</th><th>Tipo</th>${MESES_PT_ABREV.map(m => `<th>${m}</th>`).join('')}
  </tr></thead><tbody>
    ${painel.lista.map(a => `<tr>
      <td>${escapeHtml(a.nome)}</td>
      <td>
        <select onchange="alterarTipoPagamentoUI('${a.id}', this.value)" style="padding:5px;border:1px solid var(--border);border-radius:6px;">
          <option value="Pagante" ${a.tipoPagamento==='Pagante'?'selected':''}>Pagante</option>
          <option value="Bolsista" ${a.tipoPagamento==='Bolsista'?'selected':''}>🎓 Bolsista</option>
        </select>
      </td>
      ${a.tipoPagamento === 'Bolsista'
        ? `<td colspan="12" style="text-align:center;">${badge('Bolsista', '🎓 Bolsista — isento')}</td>`
        : Object.keys(a.meses).map(mm => `<td style="text-align:center;">${celulaMesPagamento(a.meses[mm])}</td>`).join('')}
    </tr>`).join('')}
  </tbody></table></div>`;
}
function celulaMesPagamento(status){
  if (status === 'aprovado') return '<span title="Pago" style="color:var(--success);font-weight:700;">✔</span>';
  if (status === 'pendente') return '<span title="Aguardando aprovação" style="color:var(--warning);font-weight:700;">⏳</span>';
  if (status === 'rejeitado') return '<span title="Rejeitado" style="color:var(--danger);font-weight:700;">✖</span>';
  return '<span class="muted" title="Sem pagamento enviado">—</span>';
}
function mudarAnoPainelPagamentos(delta){
  painelPagamentosAno += delta;
  loadTabData(state.user.perfil, 'pagamentosPendentes');
}
async function alterarTipoPagamentoUI(alunoId, tipo){
  await runAction('definirTipoPagamento', { alunoId, tipoPagamento: tipo });
}

async function aprovarUsuario(id){ await runAction('aprovarUsuario', {usuarioId:id}); }
async function rejeitarUsuario(id){ await runAction('rejeitarUsuario', {usuarioId:id}); }

/* ============================== PROFESSOR ============================== */
async function renderProfessorTab(tab){
  if (tab === 'notas') return renderNotasLoteTab();
  if (tab === 'presenca') return renderPresencaLoteTab();
  if (tab === 'avisos'){
    const [avisos, meusAvisos, materias] = await Promise.all([
      api('listarAvisos', {}),
      api('listarMeusAvisos', {}),
      api('listarMaterias', {})
    ]);
    return renderAvisosAdminTab(avisos, 'professor', meusAvisos, materias);
  }
  if (tab === 'calendario') return renderCalendarioTab(false);
  if (tab === 'meusDados') return renderMeusDadosGenerico();
  return '';
}

/* ---- Notas/Trabalhos: uma tabela única por matéria — nota, até 3 trabalhos (cada um
   com sua descrição), média e frequência já calculadas, e a situação (Aprovado/
   Reprovado) sugerida automaticamente conforme o contrato mas editável. O professor
   salva, edita ou exclui o lançamento de cada aluno direto nessa tabela — não existe
   mais uma tela separada de "Lançamentos já feitos" nem de "Aprovação por disciplina",
   porque as duas coisas já estão aqui juntas. */
async function renderNotasLoteTab(){
  const materias = await api('listarMaterias', {});
  const opcoesMaterias = materias.map(m => `<option value="${escapeHtml(m.nome)}">${escapeHtml(m.nome)}</option>`).join('');
  return `<div class="card">
    <h3>Notas / Trabalhos</h3>
    <p class="muted">Escolha a matéria — aparecem todos os alunos cursando, com a nota da prova, até 3 trabalhos (cada um com sua própria descrição), a média já calculada, a frequência do aluno nessa disciplina e a situação (Aprovado/Reprovado), sugerida automaticamente conforme o contrato (nota ≥ 60/100 e frequência ≥ 75%) — mas você pode alterar. Salve, edite ou exclua o lançamento de cada aluno quando quiser; o aluno vê o mesmo, sem poder editar.</p>
    ${materias.length ? `<div class="field" style="max-width:320px;"><label>Matéria</label>

async function carregarNotasDisciplinaProfessor(){
  const disciplina = document.getElementById('notasDisciplina').value;
  const container = document.getElementById('notasDisciplinaContainer');
  if (!disciplina){ container.innerHTML = `<p class="empty">Escolha uma matéria acima.</p>`; return; }
  container.innerHTML = `<p class="muted">Carregando...</p>`;
  try{
    const linhas = await api('carregarNotasDisciplina', { disciplina });
    container.innerHTML = renderNotasDisciplinaTable(linhas);
  }catch(e){ container.innerHTML = `<p style="color:var(--danger);">${escapeHtml(e.message)}</p>`; }
}

function renderNotasDisciplinaTable(linhas){
  if (!linhas.length) return `<p class="empty">Nenhum aluno cursando no momento.</p>`;
  return `<div style="overflow-x:auto;"><table><thead><tr>
      <th>Aluno</th><th>Nota</th><th>Trabalho 1</th><th>Trabalho 2</th><th>Trabalho 3</th>
      <th>Média</th><th>Frequência</th><th>Situação</th><th></th>
    </tr></thead><tbody>
    ${linhas.map(l => notasDisciplinaRowHtml(l)).join('')}
  </tbody></table></div>`;
}

function trabalhoCelulaHtml(n, desc, nota){
  const notaVal = (nota !== '' && nota !== undefined && nota !== null) ? nota : '';
  return `<td>
    <input class="ntd-t${n}-desc" placeholder="Descrição" value="${escapeHtml(desc||'')}" style="width:120px;padding:4px;font-size:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:3px;display:block;">
    <input class="ntd-t${n}-nota" type="number" step="0.1" min="0" max="10" placeholder="Nota" value="${notaVal}" style="width:70px;padding:4px;font-size:12px;border:1px solid var(--border);border-radius:6px;">
  </td>`;
}

function notasDisciplinaRowHtml(l){
  const situacaoAtual = l.resultadoConfirmado || l.sugestao || 'aprovado';
  const notaVal = (l.nota !== '' && l.nota !== undefined && l.nota !== null) ? l.nota : '';
  return `<tr id="ntd-row-${l.alunoId}" data-aluno="${l.alunoId}">
    <td>${escapeHtml(l.alunoNome)}</td>
    <td><input class="ntd-nota" type="number" step="0.1" min="0" max="10" value="${notaVal}" style="width:70px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
    ${trabalhoCelulaHtml(1, l.trab1Descricao, l.trab1Nota)}
    ${trabalhoCelulaHtml(2, l.trab2Descricao, l.trab2Nota)}
    ${trabalhoCelulaHtml(3, l.trab3Descricao, l.trab3Nota)}
    <td>${l.temNotas ? l.mediaCem.toFixed(1) + '/100' : '<span class="muted">—</span>'}</td>
    <td>${l.totalAulas ? Math.round(l.frequenciaPercentual) + '%' : '<span class="muted">—</span>'}</td>
    <td>
      <select class="ntd-situacao" style="padding:5px;border:1px solid var(--border);border-radius:6px;">
        <option value="aprovado" ${situacaoAtual==='aprovado'?'selected':''}>Aprovado</option>
        <option value="reprovado" ${situacaoAtual==='reprovado'?'selected':''}>Reprovado</option>
      </select>
    </td>
    <td style="white-space:nowrap;">
      <button type="button" class="btn small" onclick="salvarNotaDisciplinaAluno('${l.alunoId}')">Salvar</button>
      ${l.temLancamento ? `<button type="button" class="btn small danger" onclick="excluirNotaDisciplinaAluno('${l.alunoId}')">Excluir</button>` : ''}
    </td>
  </tr>`;
}

async function salvarNotaDisciplinaAluno(alunoId){
  const disciplina = document.getElementById('notasDisciplina').value;
  const tr = document.getElementById('ntd-row-' + alunoId);
  if (!disciplina || !tr) return;
  const val = (sel) => { const el = tr.querySelector(sel); return el ? el.value : ''; };
  const lancamento = {
    alunoId: alunoId,
    nota: val('.ntd-nota'),
    trab1Descricao: val('.ntd-t1-desc'), trab1Nota: val('.ntd-t1-nota'),
    trab2Descricao: val('.ntd-t2-desc'), trab2Nota: val('.ntd-t2-nota'),
    trab3Descricao: val('.ntd-t3-desc'), trab3Nota: val('.ntd-t3-nota')
  };
  const resultado = val('.ntd-situacao');
  try{
    await api('lancarNotasLote', { disciplina: disciplina, lancamentos: [lancamento] });
    await api('definirResultadoDisciplina', { alunoId: alunoId, disciplina: disciplina, resultado: resultado });
    toast('Lançamento salvo.', 'success');
    carregarNotasDisciplinaProfessor();
  }catch(e){ toast(e.message, 'error'); }
}

async function excluirNotaDisciplinaAluno(alunoId){
  const disciplina = document.getElementById('notasDisciplina').value;
  if (!disciplina) return;
  if (!confirm('Excluir o lançamento (nota e trabalhos) desse aluno nessa disciplina?')) return;
  try{
    const data = await api('excluirNotaAluno', { alunoId: alunoId, disciplina: disciplina });
    toast(data.mensagem, 'success');
    carregarNotasDisciplinaProfessor();
  }catch(e){ toast(e.message, 'error'); }
}

async function registrarPresencaLoteUI(){
  const data = document.getElementById('presData').value;
  const numeroAula = document.getElementById('presNumeroAula').value;
  const materia = (document.getElementById('presMateria').value || '').trim();
  if (!data || !numeroAula || !materia){ toast('Informe o dia, o número da aula e a matéria.', 'error'); return; }
  const registros = [];
  document.querySelectorAll('#tabelaPresencaLote tbody tr').forEach(function(tr){
    registros.push({
      alunoId: tr.getAttribute('data-aluno'),
      status: tr.querySelector('.pr-status').value,
      observacao: tr.querySelector('.pr-obs').value
    });
  });
  try{
    const dataResp = await api('registrarPresencaLote', { data: data, numeroAula: numeroAula, materia: materia, registros: registros });
    toast(dataResp.mensagem, 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

let resumoPresencasCache = [];

// filtro do coordenador (por matéria OU por professor, um limpa o outro) — soma os
// totais das aulas já registradas que batem com o filtro, sem precisar de uma chamada
// nova ao servidor (usa a mesma lista já carregada em "Controle de presença").
function filtrarPresencaCoordenador(origem){
  const selMateria = document.getElementById('filtroPresencaMateria');
  const selProfessor = document.getElementById('filtroPresencaProfessor');
  if (origem === 'materia' && selMateria.value) selProfessor.value = '';
  if (origem === 'professor' && selProfessor.value) selMateria.value = '';
  const materia = selMateria.value;
  const professorId = selProfessor.value;
  const container = document.getElementById('statsPresencaFiltro');
  if (!materia && !professorId){ container.innerHTML = ''; return; }
  const filtrado = resumoPresencasCache.filter(r =>
    (!materia || r.materia === materia) && (!professorId || r.professorId === professorId)
  );
  if (!filtrado.length){ container.innerHTML = `<p class="empty" style="margin-top:10px;">Nenhum registro pra esse filtro.</p>`; return; }
  const totalAtivos = filtrado.reduce((s,r) => s + r.total, 0);
  const totalPresentes = filtrado.reduce((s,r) => s + r.presentes, 0);
  const pct = totalAtivos ? Math.round(totalPresentes/totalAtivos*100) : 0;
  container.innerHTML = `<div class="row" style="margin-top:10px;">
    <div class="stat"><div class="label">Aulas no filtro</div><div class="value">${filtrado.length}</div></div>
    <div class="stat"><div class="label">Total de presenças possíveis</div><div class="value">${totalAtivos}</div></div>
    <div class="stat"><div class="label">Presentes</div><div class="value">${totalPresentes}</div></div>
    <div class="stat"><div class="label">% de presença</div><div class="value">${pct}%</div></div>
  </div>`;
}

function renderResumoPresencas(resumo, mostrarProfessor){
  resumoPresencasCache = resumo;
  if (!resumo.length) return `<p class="empty">Nenhum registro ainda.</p>`;
  const colspan = mostrarProfessor ? 8 : 7;
  return `<div style="overflow-x:auto;"><table><thead><tr><th>Data</th><th>Aula</th><th>Matéria</th>${mostrarProfessor ? '<th>Professor</th>' : ''}<th>Ativos</th><th>Presentes</th><th>%</th><th></th></tr></thead><tbody>
    ${resumo.map((r, i) => `
    <tr>
      <td>${fmtDate(r.data)}</td><td>${escapeHtml(String(r.numeroAula))}</td><td>${escapeHtml(r.materia)}</td>
      ${mostrarProfessor ? `<td>${escapeHtml(r.professorNome||'—')}</td>` : ''}
      <td>${r.total}</td><td>${r.presentes}</td><td>${Math.round(r.percentual)}%</td>
      <td style="white-space:nowrap;">
        <button type="button" class="btn small secondary" onclick="toggleResumoDetalhe(${i})">Visualizar</button>
        <button type="button" class="btn small secondary" onclick="toggleResumoEdicao(${i})">Editar</button>
        <button type="button" class="btn small danger" onclick="excluirSessaoPresencaUI('${r.sessaoId}')">Excluir</button>
      </td>
    </tr>
    <tr id="resumo-detalhe-${i}" style="display:none;"><td colspan="${colspan}">${renderResumoDetalheHtml(r)}</td></tr>
    <tr id="resumo-edicao-${i}" style="display:none;"><td colspan="${colspan}">${renderResumoEdicaoHtml(r, i)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderResumoDetalheHtml(r){
  function lista(titulo, arr){
    return `<div style="margin-bottom:8px;"><strong>${titulo} (${arr.length})</strong>
      ${arr.length ? `<ul style="margin:4px 0 0;padding-left:18px;">${arr.map(p => `<li>${escapeHtml(p.nome)}${p.observacao ? ' — ' + escapeHtml(p.observacao) : ''}</li>`).join('')}</ul>` : '<p class="muted" style="margin:4px 0 0;">Nenhum.</p>'}
    </div>`;
  }
  return `<div style="padding:10px 4px;">
    ${lista('✅ Presentes', r.listaPresentes)}
    ${lista('❌ Faltantes', r.listaFaltantes)}
    ${lista('📝 Justificados', r.listaJustificados)}
  </div>`;
}

// junta as 3 listas (presentes/faltantes/justificados) num só array pra editar o
// status de cada aluno dessa sessão de uma vez
function alunosDaSessaoPresenca(r){
  return [
    ...r.listaPresentes.map(p => ({...p, status:'presente'})),
    ...r.listaFaltantes.map(p => ({...p, status:'falta'})),
    ...r.listaJustificados.map(p => ({...p, status:'justificado'}))
  ];
}

function renderResumoEdicaoHtml(r, i){
  const alunos = alunosDaSessaoPresenca(r);
  return `<div style="padding:10px 4px;">
    <form onsubmit="salvarEdicaoPresenca(event, '${r.sessaoId}', ${i})">
      ${alunos.map(a => `<div class="row" style="align-items:center;">
        <div style="flex:1;min-width:140px;">${escapeHtml(a.nome)}</div>
        <div class="field" style="max-width:160px;">
          <select data-aluno-id="${escapeHtml(a.id)}">
            <option value="presente" ${a.status==='presente'?'selected':''}>Presente</option>
            <option value="falta" ${a.status==='falta'?'selected':''}>Faltou</option>
            <option value="justificado" ${a.status==='justificado'?'selected':''}>Justificado</option>
          </select>
        </div>
        <div class="field" style="max-width:220px;">
          <input data-aluno-obs="${escapeHtml(a.id)}" value="${escapeHtml(a.observacao||'')}" placeholder="Observação (opcional)">
        </div>
      </div>`).join('')}
      <button class="btn small" type="submit" style="margin-top:8px;">Salvar alterações</button>
    </form>
  </div>`;
}

async function salvarEdicaoPresenca(ev, sessaoId, i){
  ev.preventDefault();
  const form = ev.target;
  const registros = [];
  form.querySelectorAll('select[data-aluno-id]').forEach(sel => {
    const id = sel.dataset.alunoId;
    const obsInput = form.querySelector(`input[data-aluno-obs="${id}"]`);
    registros.push({ alunoId: id, status: sel.value, observacao: obsInput ? obsInput.value : '' });
  });
  try{
    const data = await api('editarSessaoPresenca', { sessaoId, registros });
    toast(data.mensagem, 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

async function excluirSessaoPresencaUI(sessaoId){
  if (!confirm('Excluir todos os registros de presença dessa aula? Essa ação não pode ser desfeita.')) return;
  await runAction('excluirSessaoPresenca', { sessaoId });
}

function toggleResumoDetalhe(i){
  const el = document.getElementById('resumo-detalhe-' + i);
  if (el) el.style.display = (el.style.display === 'none' ? 'table-row' : 'none');
}

function toggleResumoEdicao(i){
  const el = document.getElementById('resumo-edicao-' + i);
  if (el) el.style.display = (el.style.display === 'none' ? 'table-row' : 'none');
}

async function okCertificado(alunoId, regerar){
  const msg = regerar
    ? 'O certificado atual será substituído por um novo PDF (com os dados de hoje). Confirma?'
    : 'Confirma a liberação do certificado para este aluno?';
  if (!confirm(msg)) return;
  await runAction('okCertificado', { alunoId: alunoId });
}

async function handleCriarCoordenador(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('criarCoordenador', { nome: f.nome.value, email: f.email.value, senha: f.senha.value, sexo: f.sexo ? f.sexo.value : '' });
      toast(data.mensagem, 'success');
      f.reset();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function handleAtualizarWhatsapp(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('atualizarWhatsappFinanceiro', { numero: f.numero.value });
      toast(data.mensagem, 'success');
    }catch(e){ toast(e.message, 'error'); }
  });
}

/* ---- Matérias do curso (lista fechada, cadastrada pelo coordenador) ---- */
function renderListaMaterias(materias, professores){
  if (!materias.length) return `<p class="empty">Nenhuma matéria cadastrada ainda.</p>`;
  return `<div style="overflow-x:auto;"><table><thead><tr><th>Matéria</th><th>Professor responsável</th><th></th></tr></thead><tbody>
    ${materias.map(m => `<tr>
      <td>${escapeHtml(m.nome)}</td>
      <td>
        <select onchange="reatribuirMateriaUI('${m.id}', this.value)" style="padding:5px;border:1px solid var(--border);border-radius:6px;">
          <option value="" ${!m.professorId?'selected':''}>Geral (todo professor vê)</option>
          ${professores.map(p => `<option value="${p.id}" ${m.professorId===p.id?'selected':''}>${escapeHtml(p.nome)}</option>`).join('')}
        </select>
      </td>
      <td><button type="button" class="btn small danger" onclick="excluirMateriaUI('${m.id}')">Excluir</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

async function handleCriarMateria(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('criarMateria', { nome: f.nome.value, professorId: f.professorId ? f.professorId.value : '' });
      toast(data.mensagem, 'success');
      render();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function reatribuirMateriaUI(materiaId, professorId){
  await runAction('atualizarMateria', { materiaId, professorId });
}

async function excluirMateriaUI(materiaId){
  if (!confirm('Excluir esta matéria? Lançamentos de notas/presença já feitos com ela não são apagados, só some da lista de escolha.')) return;
  await runAction('excluirMateria', { materiaId });
}

/* ============================== INICIALIZAÇÃO ============================== */
if (state.user && state.token) state.route = 'painel';
render();
</script>
