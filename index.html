<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seminário HUIOS</title>
<style>
  :root{
    --bg:#F7F6F3; --surface:#FFFFFF; --border:#E3E1DA; --text:#111111; --muted:#6B6963;
    --primary:#111111; --primary-dark:#000000; --accent:#8B6914;
    --success:#1E7B34; --success-bg:#E6F4EA;
    --danger:#B3261E; --danger-bg:#FBEAE9;
    --warning:#9C6500; --warning-bg:#FFF2CC;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,h3{margin:0 0 8px;color:var(--primary-dark);}
  p{margin:0 0 10px;line-height:1.5;}
  .muted{color:var(--muted);}
  a{color:var(--accent);}
  .topbar{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .topbar .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .topbar .who{font-size:13px;opacity:.9;}
  .container{max-width:1000px;margin:0 auto;padding:24px 16px 96px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  .btn.danger{background:var(--danger);}
  .btn.success{background:var(--success);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted);}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;}
  .field textarea{min-height:80px;resize:vertical;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;}
  .badge.pendente{background:var(--warning-bg);color:var(--warning);}
  .badge.aprovado,.badge.liberado,.badge.presente,.badge.concluido{background:var(--success-bg);color:var(--success);}
  .badge.rejeitado,.badge.ausente{background:var(--danger-bg);color:var(--danger);}
  .badge.Ativo{background:var(--success-bg);color:var(--success);}
  .badge.Inativo{background:var(--danger-bg);color:var(--danger);}
  .badge.Formado{background:#F5E9D0;color:var(--accent);}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .stat .value{font-size:24px;font-weight:700;color:var(--primary-dark);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
  .bar-row .name{width:150px;flex-shrink:0;color:var(--muted);}
  .bar-track{flex:1;background:#EDEBE5;border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;}
  .bar-row .val{width:90px;text-align:right;font-weight:600;}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .tab-btn{background:none;border:none;border-top:3px solid transparent;flex:1 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 6px 8px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;}
  .tab-btn .tab-icon{font-size:19px;line-height:1;}
  .tab-btn .tab-label{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab-btn.active{color:var(--primary);border-top-color:var(--accent);}
  .toast{position:fixed;top:16px;right:16px;background:var(--primary-dark);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:999;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:320px;}
  .toast.error{background:var(--danger);}
  .toast.success{background:var(--success);}
  .hero{text-align:center;padding:50px 16px;}
  .hero h1{font-size:30px;}
  .hero p{max-width:520px;margin:0 auto 22px;color:var(--muted);}
  .hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:700px){.split{grid-template-columns:1fr;}}
  .link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
  .empty{color:var(--muted);font-style:italic;padding:14px 0;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
  img.preview{max-width:100%;border-radius:8px;margin-top:8px;border:1px solid var(--border);}

  .carteirinha-wrap{max-width:340px;margin:6px auto 16px;}
  .carteirinha-flip{position:relative;width:100%;aspect-ratio:1.586/1;perspective:1200px;}
  .carteirinha-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;transition:transform .6s cubic-bezier(.4,.2,.2,1);background:#111111;color:#fff;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;border:1px solid #2a2a2a;}
  .carteirinha-face::before{content:'';position:absolute;top:-40%;right:-30%;width:70%;height:140%;background:radial-gradient(circle,rgba(139,105,20,.25),transparent 65%);pointer-events:none;}
  .carteirinha-face.verso{transform:rotateY(180deg);}
  .carteirinha-flip.flipped .carteirinha-face{transform:rotateY(180deg);}
  .carteirinha-flip.flipped .carteirinha-face.verso{transform:rotateY(360deg);}
  .carteirinha-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .carteirinha-inst{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#EDE6D6;}
  .carteirinha-status{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;background:rgba(139,105,20,.35);color:#F5E9D0;padding:3px 9px;border-radius:999px;}
  .carteirinha-mid{display:flex;align-items:center;gap:14px;margin-top:auto;margin-bottom:auto;position:relative;z-index:1;}
  .carteirinha-foto{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #8B6914;flex-shrink:0;background:#222;}
  .carteirinha-foto-fallback{width:58px;height:58px;border-radius:50%;border:2px solid #8B6914;flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;color:#8B6914;}
  .carteirinha-nome{font-size:15px;font-weight:700;line-height:1.2;}
  .carteirinha-perfil{font-size:11px;color:#B8B2A3;text-transform:capitalize;margin-top:2px;}
  .carteirinha-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;color:#B8B2A3;position:relative;z-index:1;}
  .carteirinha-bottom strong{display:block;color:#fff;font-size:11px;}
  .carteirinha-verso-line{font-size:11.5px;color:#EDE6D6;margin-bottom:8px;}
  .carteirinha-verso-line span{display:block;font-size:9.5px;color:#8B8578;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;}
  .carteirinha-assinatura{margin-top:auto;border-top:1px solid #333;padding-top:8px;font-size:9px;color:#8B8578;text-align:center;position:relative;z-index:1;}
  .carteirinha-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center;}
</style>
</head>

/* ============================== ESTADO ============================== */
const state = {
  route: 'home',
  tab: null,
  token: localStorage.getItem('se_token') || null,
  user: JSON.parse(localStorage.getItem('se_user') || 'null')
};

function setSession(token, user){
  state.token = token; state.user = user;
  localStorage.setItem('se_token', token);
  localStorage.setItem('se_user', JSON.stringify(user));
}
function clearSession(){
  state.token = null; state.user = null;
  localStorage.removeItem('se_token'); localStorage.removeItem('se_user');
}

/* ============================== API ============================== */
async function api(action, payload){
  if (CONFIG.API_URL.indexOf('COLOQUE_AQUI') !== -1){
    throw new Error('Configure a API_URL no topo do arquivo index.html (veja o README).');
  }
  payload = payload || {};
  payload.action = action;
  if (state.token) payload.token = state.token;
  let res;
  try{
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){
    throw new Error('Não foi possível conectar ao servidor. Verifique sua internet ou a URL da API.');
  }
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Erro desconhecido.');
  return json.data;
}

function fileToBase64(inputEl){
  return new Promise((resolve, reject) => {
    const file = inputEl.files && inputEl.files[0];
    if (!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({ base64: reader.result, nome: file.name, mime: file.type });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================== HELPERS UI ============================== */
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
// converte um link "de visualização" do Drive (.../file/d/ID/view) num link direto de
// imagem — o link de visualização não funciona dentro de <img src>, só clicando nele.
function driveImgUrl(url){
  if (!url) return '';
  const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? ('https://lh3.googleusercontent.com/d/' + m[1]) : url;
}
function fmtDate(v){
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('pt-BR');
}
function badge(status){
  return `<span class="badge ${escapeHtml(status||'')}">${escapeHtml(status||'—')}</span>`;
}
let toastTimer = null;
function toast(msg, type){
  let el = document.getElementById('toast');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'toast';
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 4200);
}
function go(route, tab){
  state.route = route;
  state.tab = tab || null;
  render();
  window.scrollTo(0,0);
}
function setTab(tab){ state.tab = tab; render(); }

async function withLoading(btn, fn){
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Aguarde...';
  try{ await fn(); } finally { btn.disabled = false; btn.textContent = original; }
}

/* ============================== LAYOUT ============================== */
function topbar(){
  const who = state.user
    ? `<span class="who">${escapeHtml(state.user.nome)} · ${escapeHtml(state.user.perfil)}</span>
       <button class="btn secondary small" onclick="logout()" style="background:transparent;color:#fff;border-color:#fff;">Sair</button>`
    : `<button class="btn secondary small" onclick="go('login')" style="background:transparent;color:#fff;border-color:#fff;">Entrar</button>`;
  return `<div class="topbar">
    <div class="brand" onclick="go(${state.user ? "'painel'" : "'home'"})"><img src="${LOGO_DATA_URI}" alt="Seminário HUIOS" style="height:30px;display:block;"></div>
    <div style="display:flex;align-items:center;gap:12px;">${who}</div>
  </div>`;
}

async function logout(){
  try{ await api('logout', {}); }catch(e){}
  clearSession();
  go('home');
  toast('Sessão encerrada.');
}

/* ============================== ROTAS ============================== */
function render(){
  const app = document.getElementById('app');
  let html = topbar() + '<div class="container">';
  if (state.route === 'home') html += viewHome();
  else if (state.route === 'cadastroAluno') html += viewCadastro('aluno');
  else if (state.route === 'cadastroEquipe') html += viewCadastro('equipe');
  else if (state.route === 'login') html += viewLogin();
  else if (state.route === 'calendario') html += viewCalendarioPublico();
  else if (state.route === 'painel' && state.user) html += viewPainel();
  else html += viewHome();
  html += '</div>';
  app.innerHTML = html;
  afterRender();
}

function afterRender(){
  if (state.route === 'painel' && state.user){
    const perfil = state.user.perfil;
    const tab = state.tab || defaultTab(perfil);
    loadTabData(perfil, tab);
  } else if (state.route === 'calendario'){
    loadCalendarioPublico();
  } else if (state.route === 'cadastroEquipe'){
    toggleCampoDisciplinas();
  }
}

function defaultTab(perfil){
  return {aluno:'inicio', secretaria:'financeiro', professor:'notas', coordenador:'aprovacoes'}[perfil];
}

/* ============================== HOME (pública) ============================== */
function viewHome(){
  return `
  <div class="hero">
    <h1>Bem-vindo(a) ao Sistema Escolar</h1>
    <p>Inscreva-se como novo aluno, ou entre com seu cadastro de aluno, professor, secretaria ou coordenação.</p>
    <div class="hero-actions">
      <a class="btn" href="#" onclick="go('cadastroAluno');return false;">📝 Inscrição de novos alunos</a>
      <a class="btn secondary" href="#" onclick="go('login');return false;">Já tenho cadastro — Entrar</a>
      <a class="btn secondary" href="#" onclick="go('calendario');return false;">📅 Calendário de aulas e férias</a>
    </div>
    <p style="margin-top:22px;"><button class="link-btn" onclick="go('cadastroEquipe')">Sou professor(a) ou da secretaria e quero me cadastrar</button></p>
  </div>`;
}

async function handleCadastro(ev, modo){
  ev.preventDefault();
  const f = ev.target;
  const payload = {
    nome: f.nome.value, email: f.email.value, senha: f.senha.value,
    telefone: f.telefone ? f.telefone.value : '', dataNascimento: f.dataNascimento ? f.dataNascimento.value : '',
    perfil: modo === 'aluno' ? 'aluno' : f.perfil.value,
    turma: f.turma ? f.turma.value : '', turno: f.turno ? f.turno.value : '',
    sexo: f.sexo ? f.sexo.value : '', batizado: f.batizado ? f.batizado.value : '',
    disciplinas: f.disciplinas ? f.disciplinas.value : ''
  };
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('cadastro', payload);
      toast(data.mensagem, 'success');
      go('login');
    }catch(e){ toast(e.message, 'error'); }
  });
}

  financeiro:'💰', pagamentosPendentes:'💳', aprovacoesAlunos:'✅', painelAlunos:'📊', usuarios:'👥',

};

function viewPainel(){
  const perfil = state.user.perfil;
  const tabs = TABS[perfil] || [];
  const current = state.tab || defaultTab(perfil);
  let html = `<h2 style="text-transform:capitalize;">Painel — ${escapeHtml(perfil)}</h2>`;
  html += `<div id="tab-content"><p class="muted">Carregando...</p></div>`;
  html += `<div class="tabs">` + tabs.map(([key,label]) =>
    `<button class="tab-btn ${key===current?'active':''}" onclick="setTab('${key}')"><span class="tab-icon">${TAB_ICONS[key]||'•'}</span><span class="tab-label">${label}</span></button>`
  ).join('') + `</div>`;
  return html;
}

async function loadTabData(perfil, tab){
  const el = document.getElementById('tab-content');
  if (!el) return;
  try{
    let html = '';
    if (perfil === 'aluno') html = await renderAlunoTab(tab);
    else if (perfil === 'secretaria') html = await renderSecretariaTab(tab);
    else if (perfil === 'professor') html = await renderProfessorTab(tab);
    else if (perfil === 'coordenador') html = await renderCoordenadorTab(tab);
    el.innerHTML = html;
  }catch(e){
    el.innerHTML = `<div class="card"><p style="color:var(--danger);">${escapeHtml(e.message)}</p></div>`;
  }
}

let alunosCache = [];

async function renderPainelAlunosTab(podeEditar){
  const lista = await api('listarAlunosDetalhado', {});
  alunosCache = lista;
  return `
  <div class="card">${statsAlunosHtml(lista)}</div>

function statsAlunosHtml(lista){
  const total = lista.length;
  const ativos = lista.filter(a => a.situacao === 'Ativo').length;
  const inativos = lista.filter(a => a.situacao === 'Inativo').length;
  const homens = lista.filter(a => a.sexo === 'Masculino').length;
  const mulheres = lista.filter(a => a.sexo === 'Feminino').length;
  const batizados = lista.filter(a => a.batizado === 'Sim').length;
  const naoBatizados = lista.filter(a => a.batizado === 'Não').length;
  const mesAtual = new Date().getMonth();
  const aniversariantes = lista.filter(a => {
    if (!a.dataNascimento) return false;
    const d = new Date(a.dataNascimento);
    return !isNaN(d) && d.getMonth() === mesAtual;
  });
  return `
  <h3>Painel de alunos</h3>
  <div class="grid grid-3">
    <div class="stat"><div class="label">Total de alunos</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">Ativos</div><div class="value" style="color:var(--success);">${ativos}</div></div>
    <div class="stat"><div class="label">Inativos</div><div class="value" style="color:var(--danger);">${inativos}</div></div>
    <div class="stat"><div class="label">Homens</div><div class="value">${homens}</div></div>
    <div class="stat"><div class="label">Mulheres</div><div class="value">${mulheres}</div></div>
    <div class="stat"><div class="label">Batizados</div><div class="value">${batizados}</div></div>
    <div class="stat"><div class="label">Não batizados</div><div class="value">${naoBatizados}</div></div>
    <div class="stat"><div class="label">Aniversariantes do mês</div><div class="value">${aniversariantes.length}</div></div>
  </div>
  ${aniversariantes.length ? `<div style="margin-top:14px;"><strong>Aniversariantes do mês:</strong>
    <ul>${aniversariantes.map(a => `<li>${escapeHtml(a.nome)} — ${fmtDate(a.dataNascimento)}</li>`).join('')}</ul></div>` : ''}`;
}

function tabelaAlunosHtml(lista, podeEditar){
  if (!lista.length) return `<p class="empty">Nenhum aluno encontrado.</p>`;
  const head = `<tr><th>Nome</th><th>Turma</th><th>Situação</th><th>Sexo</th><th>Batizado</th><th>% Curso</th><th>Certificado</th><th>Área de Estágio</th>${podeEditar?'<th></th>':''}</tr>`;
  const rows = lista.map(a => {
    if (!podeEditar){
      return `<tr>
        <td>${escapeHtml(a.nome)}</td><td>${escapeHtml(a.turma)}</td>
        <td>${badge(a.situacao)}</td><td>${escapeHtml(a.sexo)||'—'}</td><td>${escapeHtml(a.batizado)||'—'}</td>
        <td>${a.percentualTrilha}%</td><td>${badge(a.certificadoStatus)}</td>
        <td>${a.areaEstagio ? escapeHtml(a.areaEstagio) : '<em>Não definido</em>'}</td>
      </tr>`;
    }
    return `<tr id="row-aluno-${a.id}">
      <td>${escapeHtml(a.nome)}</td>
      <td><input class="f-turma" value="${escapeHtml(a.turma)}" style="width:110px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
      <td><select class="f-situacao">
        <option value="Ativo" ${a.situacao==='Ativo'?'selected':''}>Ativo</option>
        <option value="Inativo" ${a.situacao==='Inativo'?'selected':''}>Inativo</option>
        <option value="Formado" ${a.situacao==='Formado'?'selected':''}>Formado</option>
      </select></td>
      <td><select class="f-sexo">
        <option value="">—</option>
        <option value="Masculino" ${a.sexo==='Masculino'?'selected':''}>Masculino</option>
        <option value="Feminino" ${a.sexo==='Feminino'?'selected':''}>Feminino</option>
      </select></td>
      <td><select class="f-batizado">
        <option value="">—</option>
        <option value="Sim" ${a.batizado==='Sim'?'selected':''}>Sim</option>
        <option value="Não" ${a.batizado==='Não'?'selected':''}>Não</option>
      </select></td>
      <td>${a.percentualTrilha}%</td><td>${badge(a.certificadoStatus)}</td>
      <td><input class="f-areaEstagio" value="${escapeHtml(a.areaEstagio)}" placeholder="Não definido" style="width:140px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
      <td><button class="btn small" onclick="salvarAluno('${a.id}')">Salvar</button></td>
    </tr>`;
  }).join('');
  return `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

function filtrarAlunos(){
  const termo = document.getElementById('buscaAluno').value.toLowerCase();
  const filtrado = alunosCache.filter(a => a.nome.toLowerCase().includes(termo));
  document.getElementById('tabelaAlunosContainer').innerHTML = tabelaAlunosHtml(filtrado, state.user.perfil === 'secretaria' || state.user.perfil === 'coordenador');
}

async function salvarAluno(id){
  const row = document.getElementById('row-aluno-' + id);
  const payload = {
    alunoId: id,
    turma: row.querySelector('.f-turma').value,
    situacao: row.querySelector('.f-situacao').value,
    sexo: row.querySelector('.f-sexo').value,
    batizado: row.querySelector('.f-batizado').value
  };
  const areaEstagio = row.querySelector('.f-areaEstagio').value;
  try{
    await api('atualizarAluno', payload);
    await api('definirAreaEstagio', { alunoId: id, areaEstagio: areaEstagio });
    toast('Dados do aluno atualizados.', 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

  const alunosDet = await api('listarAlunosDetalhado', {});
  const alunos = alunosDet.filter(a => a.situacao === 'Ativo');
  notasLoteState = { trabalhoSeq: 0 };
  return `<div class="card">
    <h3>Notas / Trabalhos — lançamento em massa</h3>
    <p class="muted">Escolha a disciplina, adicione quantos trabalhos quiser (cada um com uma descrição — pode ser nenhum) e preencha a prova, os trabalhos e a observação de cada aluno ativo de uma vez. Ao salvar, tudo é registrado junto.</p>
    <div class="field" style="max-width:280px;"><label>Disciplina</label><input id="notasDisciplina" placeholder="Ex: Teologia Sistemática"></div>
    <button class="btn secondary small" type="button" onclick="adicionarTrabalhoColuna()">➕ Adicionar trabalho</button>
    ${alunos.length ? `<div style="overflow-x:auto;margin-top:14px;">
      <table id="tabelaNotasLote"><thead><tr id="notasHeadRow">
        <th>Aluno</th><th>Nota (Prova)</th><th id="th-observacao">Observação</th>
      </tr></thead><tbody>
        ${alunos.map(a => notasRowHtml(a)).join('')}
      </tbody></table>
    </div>
    <button class="btn" style="margin-top:14px;" onclick="salvarNotasLote()">Salvar lançamento em massa</button>` : `<p class="empty" style="margin-top:14px;">Nenhum aluno ativo no momento.</p>`}
  </div>`;
}

function notasRowHtml(a){
  return `<tr id="notas-row-${a.id}" data-aluno="${a.id}">
    <td>${escapeHtml(a.nome)}</td>
    <td><input class="nt-nota" type="number" step="0.1" min="0" max="10" style="width:70px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
    <td class="td-observacao"><input class="nt-obs" placeholder="Opcional" style="width:150px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
  </tr>`;
}

function adicionarTrabalhoColuna(){
  notasLoteState.trabalhoSeq++;
  const colId = 'tc' + notasLoteState.trabalhoSeq;
  const headRow = document.getElementById('notasHeadRow');
  const thObs = document.getElementById('th-observacao');
  if (!headRow || !thObs) return;
  const th = document.createElement('th');
  th.id = 'th-' + colId;
  th.innerHTML = `<input class="nt-trabalho-desc" placeholder="Descrição do trabalho" style="width:130px;padding:4px;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;border:1px solid var(--border);border-radius:6px;"><br>
    <button type="button" class="link-btn" style="font-size:10px;" onclick="removerTrabalhoColuna('${colId}')">remover</button>`;
  headRow.insertBefore(th, thObs);
  document.querySelectorAll('#tabelaNotasLote tbody tr').forEach(function(tr){
    const td = document.createElement('td');
    td.setAttribute('data-trabalho', colId);
    td.innerHTML = `<select class="nt-trab-status" style="width:100%;padding:4px;font-size:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:3px;">
      <option value="pendente">Pendente</option><option value="concluido">Concluído</option>
    </select><input class="nt-trab-nota" type="number" step="0.1" min="0" max="10" placeholder="Nota" style="width:100%;padding:4px;font-size:12px;border:1px solid var(--border);border-radius:6px;">`;
    const tdObs = tr.querySelector('.td-observacao');
    tr.insertBefore(td, tdObs);
  });
}

function removerTrabalhoColuna(colId){
  const th = document.getElementById('th-' + colId);
  if (th) th.remove();
  document.querySelectorAll('#tabelaNotasLote [data-trabalho="' + colId + '"]').forEach(td => td.remove());
}

async function salvarNotasLote(){
  const disciplina = (document.getElementById('notasDisciplina').value || '').trim();
  if (!disciplina){ toast('Informe a disciplina.', 'error'); return; }
  const trabalhoCols = Array.from(document.querySelectorAll('#notasHeadRow th[id^="th-tc"]')).map(th => {
    const colId = th.id.replace('th-', '');
    const descInput = th.querySelector('.nt-trabalho-desc');
    return { id: colId, descricao: descInput ? descInput.value.trim() : '' };
  });
  const lancamentos = [];
  document.querySelectorAll('#tabelaNotasLote tbody tr').forEach(function(tr){
    const alunoId = tr.getAttribute('data-aluno');
    const nota = tr.querySelector('.nt-nota').value;
    const observacao = tr.querySelector('.nt-obs').value;
    const trabalhos = trabalhoCols.map(function(col){
      const td = tr.querySelector('[data-trabalho="' + col.id + '"]');
      return {
        descricao: col.descricao,
        status: td ? td.querySelector('.nt-trab-status').value : 'pendente',
        nota: td ? td.querySelector('.nt-trab-nota').value : ''
      };
    });
    lancamentos.push({ alunoId: alunoId, nota: nota, observacao: observacao, trabalhos: trabalhos });
  });
  try{
    const data = await api('lancarNotasLote', { disciplina: disciplina, lancamentos: lancamentos });
    toast(data.mensagem, 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

/* ---- Presença: registro em massa + resumo por sessão de aula ---- */
async function renderPresencaLoteTab(){
  const alunosDet = await api('listarAlunosDetalhado', {});
  const alunos = alunosDet.filter(a => a.situacao === 'Ativo');
  const resumo = await api('listarResumoPresencas', {});
  return `<div class="card">
    <h3>Registrar presença</h3>
    <p class="muted">Todos os alunos ativos já entram marcados como presentes — troque só quem faltou ou tem justificativa, e registre tudo de uma vez.</p>
    <div class="row">
      <div class="field"><label>Dia da aula</label><input id="presData" type="date"></div>
      <div class="field"><label>Número da aula</label><input id="presNumeroAula" type="number" min="1"></div>
      <div class="field"><label>Matéria</label><input id="presMateria" placeholder="Ex: Teologia Sistemática"></div>
    </div>
    ${alunos.length ? `<div style="overflow-x:auto;">
      <table id="tabelaPresencaLote"><thead><tr><th>Aluno</th><th>Status</th><th>Observação</th></tr></thead><tbody>
        ${alunos.map(a => `<tr data-aluno="${a.id}">
          <td>${escapeHtml(a.nome)}</td>
          <td><select class="pr-status" style="padding:5px;border:1px solid var(--border);border-radius:6px;">
            <option value="presente" selected>Presente</option>
            <option value="falta">Falta</option>
            <option value="justificado">Justificado</option>
          </select></td>
          <td><input class="pr-obs" placeholder="Opcional" style="width:160px;padding:5px;border:1px solid var(--border);border-radius:6px;"></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <button class="btn" style="margin-top:14px;" onclick="registrarPresencaLoteUI()">Registrar presença</button>` : `<p class="empty">Nenhum aluno ativo no momento.</p>`}
  </div>
  <div class="card"><h3>Últimos registros</h3>${renderResumoPresencas(resumo)}</div>`;
}

async function registrarPresencaLoteUI(){
  const data = document.getElementById('presData').value;
  const numeroAula = document.getElementById('presNumeroAula').value;
  const materia = (document.getElementById('presMateria').value || '').trim();
  if (!data || !numeroAula || !materia){ toast('Informe o dia, o número da aula e a matéria.', 'error'); return; }
  const registros = [];
  document.querySelectorAll('#tabelaPresencaLote tbody tr').forEach(function(tr){
    registros.push({
      alunoId: tr.getAttribute('data-aluno'),
      status: tr.querySelector('.pr-status').value,
      observacao: tr.querySelector('.pr-obs').value
    });
  });
  try{
    const dataResp = await api('registrarPresencaLote', { data: data, numeroAula: numeroAula, materia: materia, registros: registros });
    toast(dataResp.mensagem, 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

function renderResumoPresencas(resumo){
  if (!resumo.length) return `<p class="empty">Nenhum registro ainda.</p>`;
  return `<table><thead><tr><th>Data</th><th>Aula</th><th>Matéria</th><th>Ativos</th><th>Presentes</th><th>%</th><th></th></tr></thead><tbody>
    ${resumo.map((r, i) => `
    <tr>
      <td>${fmtDate(r.data)}</td><td>${escapeHtml(String(r.numeroAula))}</td><td>${escapeHtml(r.materia)}</td>
      <td>${r.total}</td><td>${r.presentes}</td><td>${Math.round(r.percentual)}%</td>
      <td><button type="button" class="btn small secondary" onclick="toggleResumoDetalhe(${i})">Visualizar</button></td>
    </tr>
    <tr id="resumo-detalhe-${i}" style="display:none;"><td colspan="7">${renderResumoDetalheHtml(r)}</td></tr>`).join('')}
  </tbody></table>`;
}

function renderResumoDetalheHtml(r){
  function lista(titulo, arr){
    return `<div style="margin-bottom:8px;"><strong>${titulo} (${arr.length})</strong>
      ${arr.length ? `<ul style="margin:4px 0 0;padding-left:18px;">${arr.map(p => `<li>${escapeHtml(p.nome)}${p.observacao ? ' — ' + escapeHtml(p.observacao) : ''}</li>`).join('')}</ul>` : '<p class="muted" style="margin:4px 0 0;">Nenhum.</p>'}
    </div>`;
  }
  return `<div style="padding:10px 4px;">
    ${lista('✅ Presentes', r.listaPresentes)}
    ${lista('❌ Faltantes', r.listaFaltantes)}
    ${lista('📝 Justificados', r.listaJustificados)}
  </div>`;
}

function toggleResumoDetalhe(i){
  const el = document.getElementById('resumo-detalhe-' + i);
  if (el) el.style.display = (el.style.display === 'none' ? 'table-row' : 'none');
}

/* ============================== COORDENADOR ============================== */
async function renderCoordenadorTab(tab){
  if (tab === 'aprovacoes'){
    const pendentes = await api('listarPendentes', {});
    return renderAprovacoesCard(pendentes, 'equipe');
  }
  if (tab === 'trilha'){
    const alunos = await api('listarAlunosDetalhado', {});
    return `<div class="card"><h3>Progresso do curso e área de estágio</h3>
      <p class="muted">A área de estágio fica "Não definido" até você (ou a secretaria) definir — normalmente próximo do final do curso.</p>
      <table><thead><tr><th>Aluno</th><th>Turma</th><th>% Curso</th><th>Área de Estágio</th><th></th></tr></thead><tbody>
        ${alunos.map(a => `<tr id="row-trilha-${a.id}">
          <td>${escapeHtml(a.nome)}</td><td>${escapeHtml(a.turma)}</td>
          <td><input class="f-percentual" type="number" min="0" max="100" value="${a.percentualTrilha}" style="width:70px;padding:6px;border:1px solid var(--border);border-radius:6px;"></td>
          <td><input class="f-areaEstagio" value="${escapeHtml(a.areaEstagio)}" placeholder="Não definido" style="width:170px;padding:6px;border:1px solid var(--border);border-radius:6px;"></td>
          <td><button class="btn small" onclick="salvarTrilha('${a.id}')">Salvar</button></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  if (tab === 'certificados'){
    const alunos = await api('listarAlunos', {});
    return `<div class="card"><h3>Certificados digitais</h3>
      <table><thead><tr><th>Aluno</th><th>Turma</th><th>% Curso</th><th>Status</th><th></th></tr></thead><tbody>
        ${alunos.map(a => `<tr>
          <td>${escapeHtml(a.nome)}</td><td>${escapeHtml(a.turma)}</td><td>${a.percentualTrilha}%</td>
          <td>${badge(a.certificadoStatus)}</td>
          <td>${a.certificadoStatus !== 'liberado' ? `<button class="btn small success" onclick="okCertificado('${a.id}')">OK — liberar</button>` : '<span class="muted">Liberado</span>'}</td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
  }
  if (tab === 'presenca'){
    const resumo = await api('listarResumoPresencas', {});
    return `<div class="card"><h3>Controle de presença (todas as turmas)</h3>${renderResumoPresencas(resumo)}</div>`;
  }
  if (tab === 'avisos'){
    const avisos = await api('listarAvisos', {});
    const pendentes = await api('listarAvisosPendentes', {});
    return renderAvisosPendentesCard(pendentes) + renderAvisosAdminTab(avisos, 'coordenador');
  }
  if (tab === 'painelAlunos') return renderPainelAlunosTab(true);
  if (tab === 'usuarios') return renderUsuariosTab();
  if (tab === 'calendario') return renderCalendarioTab(true);
  if (tab === 'meusDados') return renderMeusDadosGenerico();
  if (tab === 'config'){
    const cfg = await api('getConfiguracoes', {});
    return `<div class="card">
      <h3>WhatsApp do financeiro</h3>
      <p class="muted">Esse número recebe a mensagem automática, pelo WhatsApp, sempre que um aluno clica em "Enviar pagamento". Formato internacional, só dígitos (ex: 55 + DDD + número).</p>
      <form onsubmit="handleAtualizarWhatsapp(event)">
        <div class="field"><label>Número de WhatsApp</label><input required name="numero" value="${escapeHtml(cfg.whatsappFinanceiro||'')}" placeholder="5511999999999"></div>
        <button class="btn" type="submit">Salvar</button>
      </form>
    </div>`;
  }
  if (tab === 'equipe'){
    return `<div class="card">
      <h3>Criar novo coordenador</h3>
      <form onsubmit="handleCriarCoordenador(event)">
        <div class="field"><label>Nome</label><input required name="nome"></div>
        <div class="field"><label>Email</label><input required type="email" name="email"></div>
        <div class="field"><label>Senha</label><input required type="password" name="senha" minlength="4"></div>
        <button class="btn" type="submit">Criar coordenador</button>
      </form>
    </div>`;
  }
  return '';
}

async function salvarTrilha(id){
  const row = document.getElementById('row-trilha-' + id);
  const percentual = row.querySelector('.f-percentual').value;
  const areaEstagio = row.querySelector('.f-areaEstagio').value;
  try{
    await api('atualizarTrilha', { alunoId: id, percentual: percentual });
    await api('definirAreaEstagio', { alunoId: id, areaEstagio: areaEstagio });
    toast('Atualizado.', 'success');
    render();
  }catch(e){ toast(e.message, 'error'); }
}

async function okCertificado(alunoId){
  if (!confirm('Confirma a liberação do certificado para este aluno?')) return;
  await runAction('okCertificado', { alunoId: alunoId });
}

async function handleCriarCoordenador(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('criarCoordenador', { nome: f.nome.value, email: f.email.value, senha: f.senha.value });
      toast(data.mensagem, 'success');
      f.reset();
    }catch(e){ toast(e.message, 'error'); }
  });
}

async function handleAtualizarWhatsapp(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector('button[type=submit]');
  await withLoading(btn, async () => {
    try{
      const data = await api('atualizarWhatsappFinanceiro', { numero: f.numero.value });
      toast(data.mensagem, 'success');
    }catch(e){ toast(e.message, 'error'); }
  });
}

/* ============================== INICIALIZAÇÃO ============================== */
if (state.user && state.token) state.route = 'painel';
render();
</script>
